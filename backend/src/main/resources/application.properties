spring.application.name=learningen
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/learningen}
spring.datasource.username=${DATABASE_USER:learningen}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.error.include-message=never
app.bootstrap.email=${BOOTSTRAP_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:true}
app.ai.base-url=${AI_BASE_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.daily-requests=${AI_DAILY_REQUESTS:30}
app.ai.daily-tokens=${AI_DAILY_TOKENS:50000}
app.ai.global-daily-tokens=${AI_GLOBAL_DAILY_TOKENS:100000}
app.ai.max-input-tokens=${AI_MAX_INPUT_TOKENS:12000}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1000}
app.ai.input-cost-per-million=${AI_INPUT_COST_PER_MILLION:0}
app.ai.output-cost-per-million=${AI_OUTPUT_COST_PER_MILLION:0}
