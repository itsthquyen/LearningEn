spring.application.name=learningen
server.port=${BACKEND_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/learningen}
spring.datasource.username=${DATABASE_USER:learningen}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.error.include-message=never
app.bootstrap.email=${BOOTSTRAP_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:true}
app.ai.base-url=${AI_BASE_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.daily-requests=${AI_DAILY_REQUESTS:30}
app.ai.daily-tokens=${AI_DAILY_TOKENS:50000}
app.ai.global-daily-tokens=${AI_GLOBAL_DAILY_TOKENS:100000}
app.ai.max-input-tokens=${AI_MAX_INPUT_TOKENS:12000}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1000}
app.ai.input-cost-per-million=${AI_INPUT_COST_PER_MILLION:0}
app.ai.output-cost-per-million=${AI_OUTPUT_COST_PER_MILLION:0}
app.ai.cost-tracking-enabled=${AI_COST_TRACKING_ENABLED:false}
app.ai.daily-cost-limit=${AI_DAILY_COST_LIMIT:1}
app.ai.global-daily-cost-limit=${AI_GLOBAL_DAILY_COST_LIMIT:5}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:45}
app.learning.pass-score=${LEARNING_PASS_SCORE:80}
app.ai.vision.enabled=${AI_VISION_ENABLED:false}
app.ai.vision.model=${AI_VISION_MODEL:}
app.ai.vision.max-images=${AI_VISION_MAX_IMAGES:3}
app.ai.vision.max-image-bytes=${AI_VISION_MAX_IMAGE_BYTES:5242880}
app.ai.vision.max-total-image-bytes=${AI_VISION_MAX_TOTAL_IMAGE_BYTES:12582912}
app.ai.vision.max-image-pixels=${AI_VISION_MAX_IMAGE_PIXELS:16000000}
app.ai.vision.tokens-per-image=${AI_VISION_TOKENS_PER_IMAGE:4096}
app.ai.vision.max-output-tokens=${AI_VISION_MAX_OUTPUT_TOKENS:6000}
app.ai.vision.input-cost-per-million=${AI_VISION_INPUT_COST_PER_MILLION:0}
app.ai.vision.output-cost-per-million=${AI_VISION_OUTPUT_COST_PER_MILLION:0}
spring.servlet.multipart.max-file-size=${AI_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${AI_MULTIPART_MAX_REQUEST_SIZE:13MB}
# Keep uploads in bounded memory rather than writing private pictures to temporary files.
spring.servlet.multipart.file-size-threshold=${AI_MULTIPART_MAX_REQUEST_SIZE:13MB}
