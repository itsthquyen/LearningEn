name: Verify LearningEN
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learningen_test
          POSTGRES_USER: learningen_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U learningen_test -d learningen_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend and PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/learningen_test
          TEST_POSTGRES_USER: learningen_test
          TEST_POSTGRES_PASSWORD: test-only-ci-password
        run: mvn -B verify
      - name: Frontend install, tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Browser setup
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Isolated end-to-end tests
        run: node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            backend/target/surefire-reports/
            work/e2e/results.json
            work/e2e/*dashboard.png
          retention-days: 7
